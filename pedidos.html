<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Pedidos | HEEEPH</title><link rel="stylesheet" href="css/pagamento.css"></head>
<body><main class="checkout"><a class="marca" href="index.html">HEEEPH</a><h1>Painel de pedidos</h1><p class="aviso">Ambiente de teste. As compras são simuladas e não devem ser postadas. Registros mantidos por 30 dias.</p>
<form id="acesso"><label>Chave de acesso do administrador<input id="chave" type="password" autocomplete="off" minlength="32" required></label><button id="carregar">Carregar / atualizar pedidos</button><button type="button" id="sair" hidden>Sair</button></form>
<p id="mensagem" role="status" aria-live="polite"></p><div id="filtros" class="painel-filtros" hidden><input id="busca" type="search" aria-label="Buscar pedido ou cliente" placeholder="Número, nome, e-mail ou produto"><select id="filtro" aria-label="Situação do pagamento"><option value="todos">Todos os pagamentos</option><option value="aprovados">Aprovados</option><option value="pendentes">Pendentes / não iniciados</option><option value="recusados">Recusados / cancelados</option></select><button type="button" id="imprimir">Imprimir lista exibida</button></div><p id="contagem"></p><div id="pedidos"></div></main><script src="js/pedidos.js"></script></body></html>
