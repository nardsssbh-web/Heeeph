<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Politica de Privacidade | HEEEPH</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #f0c400;
      --gold-light: #ffd84d;
      --text-soft: rgba(255, 255, 255, .76);
      --panel: rgba(0, 0, 0, .74);
      --line: rgba(255, 255, 255, .10);
      --topo-altura: 72px;
    }

    html {
      scroll-behavior: smooth;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        linear-gradient(rgba(0, 0, 0, .12), rgba(0, 0, 0, .32)),
        url("banner/fundo.png") center top / cover no-repeat fixed;
      background-color: #000;
      overflow-x: hidden;
      padding-top: var(--topo-altura);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .topo {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, .96);
      border-bottom: 1px solid rgba(255, 255, 255, .07);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .32);
    }

    .topo::after {
      content: "";
      display: block;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(240, 196, 0, .95), rgba(240, 196, 0, .12), rgba(240, 196, 0, .95), transparent);
    }

    .topo .wrap {
      max-width: 1500px;
      min-height: 70px;
      margin: 0 auto;
      padding: 10px 18px 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .logo a {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #fff;
      white-space: nowrap;
    }

    .menu-area {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-left: auto;
      min-width: 0;
    }

    .menu {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .menu a {
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      white-space: nowrap;
      transition: .2s ease;
    }

    .menu a:hover,
    .menu a.ativo {
      color: var(--gold);
    }

    .cart-link {
      position: relative;
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .cart-link img {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .cart-count {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--gold);
      color: #000;
      font-size: 11px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
    }
